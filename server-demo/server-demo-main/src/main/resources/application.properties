spring.application.name=joycue-local-demo
server.port=8080

# Local persistent database. Data is stored under server-demo/data/.
spring.datasource.url=jdbc:h2:file:./data/joycue;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

mybatis.configuration.map-underscore-to-camel-case=true

# Replaces the former remote configuration value. Override with DEMO_MESSAGE if needed.
demo.message=${DEMO_MESSAGE:JoyCue local demo}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always



